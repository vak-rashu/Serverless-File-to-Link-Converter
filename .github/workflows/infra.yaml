name: Infra pipeline

on:
    pull_request:
        branches:
          - main
        paths:
            -   'modules/**'
    
    push:
        branches:
          - 'main'
        
        paths:
          - 'modules/**'

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: "ap-south-1"
  TF_WORKING_DIR: "./modules"

jobs:
    validation:
        runs-on: ubuntu-latest
        defaults:
          run:
            working-directory:  ${{ env.TF_WORKING_DIR  }}
        steps:
            -   name:   Checkout Code
                uses:   actions/checkout@v4

            -   name:   Setup Terraform CLI
                uses:   hashicorp/setup-terraform@v4
                with:
                    terraform_version: "1.16.1"

            -   name:   Run Terraform Init
                run:    terraform init -backend=false --test-directory=.terraform/dummy_tests

            -   name:   Validate and Format Terraform Code
                run:    |
                        terraform validate
                        terraform fmt

            -   name:   Setup Tflint
                uses:   terraform-linters/setup-tflint@v6
                with:
                  cache:  true

            -   name:   Run Tflint
                run:    |
                        tflint --init
                        tflint

            -   name:   Run Terraform Tests
                run:    terraform test

    plan:
        runs-on:    ubuntu-latest
        needs:      validation
        defaults:
          run:
            working-directory: ${{  env.TF_WORKING_DIR  }}

        steps:
            -   name:   Checkout code
                uses:   action/checkout@v4

            -   name:   Checkout Terraform Code
                uses:   hashicorp/setup-terraform@v4

            -   name:   Configure AWS Credentials
                uses:   aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
                with:   
                    role-to-assume: arn:aws:iam::${{ secrets.AWS_ACC_ID }}:role/terraform-cicd-pipeline-automation-access
                    aws-region: ${{ env.AWS_REGION }}

            -   name:   Init Terraform
                run:    terraform init

                # add the plan as a comment
            -   name:   Run Terraform Plan
                id: tf-plan
                run:    terraform plan -no-color

            -   name:   Post plan in the comment
                if: github.event_name == 'pull_request'
                uses:   actions/github-script@v9

                with:
                    github-token:   ${{     secrets.GITHUB_TOKEN_COMMENT    }}
                    script: |
                        console.log("------Terraform Plan------")
                        const planComment = `#### Terraform Plan
                                <details><summary> Show Plan </summary>

                                ```
                                ${{ steps.tf-plan.outputs.stdout }}
                                ```

                                </details>

                                *Pushed by: @${{    github.actor    }}, Action: \`${{   github.event_name   }}\`*``;

                                github.rest.issues.createComment({
                                    issue_number:   context.issue.number,
                                    owner:  context.repo.owner,
                                    repo:   context.repo.repo,
                                    body:   planComment
                                });

            -   name:   Run Terraform Plan
                run:    terraform plan -out=tfplan

            -   name:   Upload Plan Artifact
                uses:   actions/upload-artifact@v4
                with:
                    name:   tfplan
                    path:   ${{ env.TF_WORKING_DIR }}/tfplan
                    retention-days: 1

    apply_changes:
        runs-on: ubuntu-latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        defaults:
          run:
            working-directory: ${{  env.TF_WORKING_DIR  }}

        environment: apply-changes

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name:   Configure AWS Credentials
              uses:   aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
              with:   
                role-to-assume: arn:aws:iam::${{ secrets.AWS_ACC_ID }}:role/terraform-cicd-pipeline-automation-access
                aws-region: ${{ env.AWS_REGION }}

            -   name:   Init Terraform
                run: terraform init

            -   name:   Download Plan Artifact
                uses:   actions/download-artifact@v4
                with:
                    name:   tfplan
                    path:   'modules'

            -   name:   Terraform Apply
                run:    terraform apply -input=false tfplan
